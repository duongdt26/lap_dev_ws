twist_mux:
  ros__parameters:
    topics:
      navigation:
        topic   : cmd_vel_nav
        timeout : 0.5
        priority: 10
      magnetic_line:
        topic   : cmd_vel_line
        timeout : 0.3
        priority: 70
      web:
        topic   : cmd_vel_web
        timeout : 1.0
        priority: 80
      # Stop/Start: đè 0 lên nav (không cancel Nav2). Priority > navigation.
      pause:
        topic   : cmd_vel_pause
        timeout : 0.3
        priority: 90
      keyboard:
        topic   : cmd_vel_key
        # topic   : diff_cont/cmd_vel_unstamped
        timeout : 0.5
        priority: 100
    locks:
      emergency:
        topic   : emergency/bumper
        timeout : 0.0
        priority: 255

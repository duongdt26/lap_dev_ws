controller_server:
  ros__parameters:
    use_sim_time: True
    # controller server parameters (see Controller Server for more info)
    controller_frequency: 15.0
    transform_tolerance: 0.5
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 5.0
    progress_checker_plugins: ["progress_checker"] # progress_checker_plugin: "progress_checker" For Humble and older
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 20.0
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.13
      yaw_goal_tolerance: 0.2
      stateful: false
    # DWB controller parameters
    FollowPath:
      plugin: "nav2_rotation_shim_controller::RotationShimController"

      # angular_dist_threshold: 0.523599  # ≈ 30° mới xoay (đầu path / lệch lớn)
      angular_dist_threshold: 0.5  # ≈ 29° mới xoay (đầu path / lệch lớn)  
      angular_disengage_threshold: 0.17  # ≈ 25° thì shim nhường DWB
      # forward_sampling_distance: 1.0
      forward_sampling_distance: 0.5
      rotate_to_heading_angular_vel: 0.35
      max_angular_accel: 5.25
      max_cost_threshold: 254.0
      simulate_ahead_time: 1.0

      # Quan trọng: không để Shim xoay cuối goal
      rotate_to_goal_heading: false
      primary_controller: "dwb_core::DWBLocalPlanner"
      # plugin: "dwb_core::DWBLocalPlanner"

      debug_trajectory_details: false

      # ======================
      # Vận tốc tuyến tính
      # ======================
      min_vel_x: -0.15
      max_vel_x: 0.30
      min_vel_y: 0.0
      max_vel_y: 0.0

      # Xe của bạn chạy ổn thấp nhất 0.06 m/s
      # Không nên để min_vel_x = 0.06, vì xe cần có mẫu dừng 0.0
      min_speed_xy: 0.033
      max_speed_xy: 0.30

      # ======================
      # Vận tốc xoay
      # ======================
      max_vel_theta: 0.3  # 318,181818182
      min_speed_theta: 0.121  # 0.121 rad/s

      # ======================
      # Gia tốc
      # ======================
      acc_lim_x: 7.0
      acc_lim_y: 0.0
      acc_lim_theta: 5.0

      decel_lim_x: -4.5
      decel_lim_y: 0.0
      decel_lim_theta: -5.0

      # ======================
      # Sampling
      # ======================
      vx_samples: 81
      vy_samples: 1
      vtheta_samples: 81

      # ======================
      # Mô phỏng trajectory
      # ======================
      sim_time: 2.0
      linear_granularity: 0.015
      angular_granularity: 0.02

      transform_tolerance: 0.5

      # ======================
      # Goal tolerance
      # ======================
      xy_goal_tolerance: 0.13
      yaw_goal_tolerance: 0.2

      # Quan trọng: phải nhỏ hơn vận tốc chạy thấp nhất
      # Xe chạy thấp nhất 0.06 thì stopped nên để khoảng 0.02 - 0.03
      trans_stopped_velocity: 0.03

      short_circuit_trajectory_evaluation: true
      limit_vel_cmd_in_traj: false
      stateful: false

      # ======================
      # Critics
      # ======================
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]

      # Xe dài và rộng, không nên để obstacle scale quá thấp như bộ 1
      BaseObstacle.scale: 0.10

      # Bám path vừa phải, không ép quá gắt
      # PathAlign.scale: 40.0 #Scale càng cao, xe càng cố căn hướng theo path. Nếu xe cắt góc nhiều, tăng:
      # PathAlign.forward_point_distance: 0.18

      PathAlign.scale: 60.0 #Scale càng cao, xe càng cố căn hướng theo path. Nếu xe cắt góc nhiều, tăng:
      PathAlign.forward_point_distance: 0.28

      GoalAlign.scale: 4.0 #Critic này chấm độ thẳng hàng với hướng goal, Nếu cao quá, xe có xu hướng sớm quay đầu về goal, dễ cắt path cong.
      GoalAlign.forward_point_distance: 0.18

      PathDist.scale: 52.0
      GoalDist.scale: 22.0 #Nếu GoalDist cao, DWB có xu hướng chọn đường tiến nhanh về goal hơn.

      # Đoạn cuối xoay vừa phải, không gắt như bộ 1
      RotateToGoal.scale: 1.0 # Neu tang xe sẽ rất cố xoay đúng yaw cuối.
      RotateToGoal.slowing_factor: 1.8 #Hệ số làm chậm khi gần goal và chuẩn bị xoay. Số càng lớn, xe càng giảm tốc nhiều hơn trước khi xoay.
      RotateToGoal.lookahead_time: -1.0 #Nếu > 0: thời gian (s) nhìn trước để kiểm tra va chạm; -1 để tắt

local_costmap:
 local_costmap:
   ros__parameters:
     update_frequency: 5.0  # Tan so (Hz) cap nhat costmap
     publish_frequency: 2.0  # Tan so (Hz) publish costmap len topic
     global_frame: odom  # Khung toa do tham chieu cua costmap
     # robot_base_frame: base_link
     robot_base_frame: base_footprint  # Khung goc robot
     use_sim_time: True  # Dung thoi gian mo phong (/clock) thay vi thoi gian thuc
     rolling_window: true  # true: costmap di chuyen theo robot (local); false: co dinh trong global frame
     # width: 3
     # height: 3
     width: 6  # Chieu rong costmap (m)
     height: 6  # Chieu cao costmap (m)
     resolution: 0.05  # Do phan giai moi o (m)
     # robot_radius: 0.22
     footprint: "[ [0.585, 0.3325], [0.585, -0.3325], [-0.585, -0.3325], [-0.585, 0.3325] ]"  # Da giac footprint robot (m), khep kin
     plugins: ["voxel_layer", "inflation_layer"]  # Danh sach layer plugin costmap
     # Keepout chạy sau các plugin thường. Inflation riêng phía sau biến toàn bộ
     # polygon cấm thành vật cản có biên an toàn theo đúng footprint robot.
     filters: ["keepout_filter", "keepout_inflation_layer"]
     keepout_filter:
       plugin: "nav2_costmap_2d::KeepoutFilter"
       enabled: True
       filter_info_topic: "/keepout_costmap_filter_info"
       transform_tolerance: 0.5
     keepout_inflation_layer:
       plugin: "nav2_costmap_2d::InflationLayer"
       cost_scaling_factor: 6.0
       inflation_radius: 0.78
     inflation_layer:
       plugin: "nav2_costmap_2d::InflationLayer"  # Layer phong dai cost quanh vat can
       cost_scaling_factor: 6.0  # He so suy giam mu cost trong vung inflation
       # inflation_radius: 0.55
       inflation_radius: 0.78 # sqrt(0.585^2 + 0.3325^2) --- Ban kinh (m) phong dai cost quanh vat can lethal
     voxel_layer:
       plugin: "nav2_costmap_2d::VoxelLayer"  # Layer voxel 3D tu laser/depth, nen thanh costmap 2D
       enabled: True  # Bat/tat layer
       publish_voxel_map: False  # Publish voxel grid 3D de debug (ton CPU)
       origin_z: 0.0  # Do cao bat dau danh dau voxel (m)
       z_resolution: 0.05  # Do phan giai voxel theo truc Z (m)
       z_voxels: 16  # So voxel theo chieu cao (toi da 16)
       max_obstacle_height: 2.0  # Chieu cao toi da ghi nhan vat can (m)
       mark_threshold: 0  # So voxel toi thieu trong cot de danh dau occupied tren lop 2D
       observation_sources: scan  # Namespace cac nguon cam bien
       scan:
         # topic: /scan
         topic: /scan_filtered  # Topic du lieu cam bien
         max_obstacle_height: 2.0  # Chieu cao toi da ghi nhan vat can tu nguon scan (m)
         clearing: True  # Raytrace xoa vung trong costmap
         marking: True  # Danh dau vat can tren costmap
         data_type: "LaserScan"  # Kieu du lieu: LaserScan hoac PointCloud2
         raytrace_max_range: 3.0  # Tam raytrace xoa toi da (m)
         raytrace_min_range: 0.0  # Tam raytrace xoa toi thieu (m)
         obstacle_max_range: 2.5  # Tam danh dau vat can toi da (m)
         obstacle_min_range: 0.0  # Tam danh dau vat can toi thieu (m)
     static_layer:
       plugin: "nav2_costmap_2d::StaticLayer"  # Layer nap ban do tinh tu map_server/SLAM
       map_subscribe_transient_local: True  # QoS transient_local cho topic map
     always_send_full_costmap: True  # Gui toan bo costmap moi lan cap nhat thay vi chi phan thay doi


global_costmap:
 global_costmap:
   ros__parameters:
     update_frequency: 1.0  # Tan so (Hz) cap nhat costmap
     publish_frequency: 1.0  # Tan so (Hz) publish costmap len topic
     global_frame: map  # Khung toa do tham chieu cua costmap
     # robot_base_frame: base_link
     robot_base_frame: base_footprint  # Khung goc robot
     use_sim_time: True  # Dung thoi gian mo phong (/clock) thay vi thoi gian thuc
     # robot_radius: 0.22
     footprint: "[ [0.585, 0.3325], [0.585, -0.3325], [-0.585, -0.3325], [-0.585, 0.3325] ]"  # Da giac footprint robot (m), khep kin
     resolution: 0.05  # Do phan giai moi o (m)
     track_unknown_space: true  # false: coi o chua biet la free; true: giu la unknown
     plugins: ["static_layer", "obstacle_layer", "inflation_layer"]  # Danh sach layer plugin costmap
     # Global planner né polygon cấm; local controller dùng cùng mask trong cửa
     # sổ rolling 6x6 m. Inflation 0.78 m giống local costmap để không quét thân xe.
     filters: ["keepout_filter", "keepout_inflation_layer"]
     keepout_filter:
       plugin: "nav2_costmap_2d::KeepoutFilter"
       enabled: True
       filter_info_topic: "/keepout_costmap_filter_info"
       transform_tolerance: 0.5
     keepout_inflation_layer:
       plugin: "nav2_costmap_2d::InflationLayer"
       cost_scaling_factor: 6.0
       inflation_radius: 0.78
     obstacle_layer:
       plugin: "nav2_costmap_2d::ObstacleLayer"  # Layer vat can 2D tu laser/depth
       enabled: True  # Bat/tat layer
       observation_sources: scan  # Namespace cac nguon cam bien
       scan:
         # topic: /scan
         topic: /scan_filtered  # Topic du lieu cam bien
         max_obstacle_height: 2.0  # Chieu cao toi da ghi nhan vat can tu nguon scan (m)
         clearing: True  # Raytrace xoa vung trong costmap
         marking: True  # Danh dau vat can tren costmap
         data_type: "LaserScan"  # Kieu du lieu: LaserScan hoac PointCloud2
         raytrace_max_range: 3.0  # Tam raytrace xoa toi da (m)
         raytrace_min_range: 0.0  # Tam raytrace xoa toi thieu (m)
         obstacle_max_range: 2.5  # Tam danh dau vat can toi da (m)
         obstacle_min_range: 0.0  # Tam danh dau vat can toi thieu (m)
     static_layer:
       plugin: "nav2_costmap_2d::StaticLayer"  # Layer nap ban do tinh tu map_server/SLAM
       map_subscribe_transient_local: True  # QoS transient_local cho topic map
     inflation_layer:
       plugin: "nav2_costmap_2d::InflationLayer"  # Layer phong dai cost quanh vat can
       cost_scaling_factor: 4.25  # He so suy giam mu cost trong vung inflation
       # inflation_radius: 0.55
       inflation_radius: 0.78 # sqrt(0.585^2 + 0.3325^2) --- Ban kinh (m) phong dai cost quanh vat can lethal
     always_send_full_costmap: True  # Gui toan bo costmap moi lan cap nhat thay vi chi phan thay doi


map_server:
 ros__parameters:
   use_sim_time: True  # Dung thoi gian mo phong (/clock) thay vi thoi gian thuc
   # Overridden in launch by the "map" launch configuration or provided default value.
   # To use in yaml, remove the default "map" value in the tb3_simulation_launch.py file & provide full path to map below.
   yaml_filename: ""  # Duong dan file map YAML; de trong thi nap map qua service/launch


map_saver:
 ros__parameters:
   use_sim_time: True  # Dung thoi gian mo phong (/clock) thay vi thoi gian thuc
   save_map_timeout: 5.0  # Timeout (s) khi luu ban do
   free_thresh_default: 0.25  # Nguong xac suat toi da mac dinh cho o free khi luu occupancy grid
   occupied_thresh_default: 0.65  # Nguong xac suat toi thieu mac dinh cho o occupied khi luu occupancy grid
   map_subscribe_transient_local: True  # QoS transient_local khi subscribe topic map de luu

planner_server:
  ros__parameters:
    expected_planner_frequency: 15.0
    use_sim_time: True
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlanner2D"
      downsample_costmap: false # true: giam do phan giai costmap de tang toc do planner; false: giu nguyen do phan giai costmap
      downsampling_factor: 1 # He so giam do phan giai costmap khi downsample_costmap = true
      tolerance: 0.10
      allow_unknown: true  # Cho phep plan qua vung unknown tren costmap
      max_iterations: 1000000 # So vong lap toi da khi tim duong di
      max_on_approach_iterations: 1000  # So vong lap toi da khi tiep can goal
      max_planning_time: 1.5  # Thoi gian toi da (s) cho moi lan plan
      cost_travel_multiplier: 1.0 # He so nhan chi phi di chuyen (diem costmap) khi tinh duong di
      use_final_approach_orientation: false # true: tinh huong cuoi path theo goal; false: giu huong cuoi path theo duong di
      cache_obstacle_heuristic: false # true: luu tru heuristic obstacle de tang toc do planner; false: tinh lai heuristic moi lan plan
      allow_partial_paths: false # true: cho phep plan duong di khong ho
      smooth_path: true # true: lam muot duong di; false: giu duong di goc
      smoother: 
        max_iterations: 1000  # So vong lap toi da truoc khi dung lam muot
        w_smooth: 0.25  # Trong so critic: lam muot duong di
        w_data: 0.25 # Trong so critic: giu duong di goc
        tolerance: 1.0e-10 # Nguong thay doi tham so duong di de dung lam muot
        do_refinement: true # Lam muot lap lai duong di da muot de tang chat luong

smoother_server:
 ros__parameters:
   use_sim_time: True  # Dung thoi gian mo phong (/clock) thay vi thoi gian thuc
   smoother_plugins: ["simple_smoother"]  # Danh sach plugin lam muot path
   simple_smoother:
     plugin: "nav2_smoother::SimpleSmoother"  # Plugin lam muot path don gian
     tolerance: 1.0e-10  # Nguong thay doi tham so path de dung lam muot
     max_its: 1000  # So vong lap toi da truoc khi dung lam muot
     do_refinement: True  # Lam muot lap lai path da muot de tang chat luong


behavior_server:
 ros__parameters:
   costmap_topic: local_costmap/costmap_raw  # Topic costmap raw de kiem tra va cham khi recovery
   footprint_topic: local_costmap/published_footprint  # Topic footprint robot tren local costmap
   cycle_frequency: 10.0  # Tan so (Hz) chay behavior plugin (spin, backup, ...)
   behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]  # Danh sach plugin hanh vi phuc hoi
   spin:
     plugin: "nav2_behaviors/Spin"  # Plugin xoay tai cho
   backup:
     plugin: "nav2_behaviors/BackUp"  # Plugin lui lai
   drive_on_heading:
     plugin: "nav2_behaviors/DriveOnHeading"  # Plugin di theo huong co dinh
   wait:
     plugin: "nav2_behaviors/Wait"  # Plugin cho (thoi gian cho tu action request)
   assisted_teleop:
     plugin: "nav2_behaviors/AssistedTeleop"  # Plugin dieu khien tay co ho tro tranh va cham
   global_frame: odom  # Khung toa do tham chieu cho hanh vi phuc hoi
   # robot_base_frame: base_link
   robot_base_frame: base_footprint  # Khung goc robot
   transform_tolerance: 0.1  # Dung sai TF (s)
   use_sim_time: true  # Dung thoi gian mo phong (/clock) thay vi thoi gian thuc
   simulate_ahead_time: 2.0  # Thoi gian (s) mo phong phia truoc de kiem tra va cham
   max_rotational_vel: 0.3  # Van toc goc toi da (rad/s) cho spin
  #  max_rotational_vel: 0.35  # Van toc goc toi da (rad/s) cho spin
   # min_rotational_vel: -0.5  # Van toc goc toi thieu (rad/s) cho spin
   min_rotational_vel: 0.121  # Van toc goc toi thieu (rad/s) cho spin
   # rotational_acc_lim: 0.22  # Gia toc goc toi da (rad/s^2) cho spin
   rotational_acc_lim: 4.5  # Gia toc goc toi da (rad/s^2) cho spin


robot_state_publisher:
 ros__parameters:
   use_sim_time: True


waypoint_follower:
 ros__parameters:
   use_sim_time: True  # Dung thoi gian mo phong (/clock) thay vi thoi gian thuc
   loop_rate: 20  # Tan so (Hz) kiem tra ket qua navigation hien tai
   stop_on_failure: false  # true: dung khi 1 waypoint that bai; false: tiep tuc waypoint tiep theo
   waypoint_task_executor_plugin: "wait_at_waypoint"  # Plugin thuc thi tac vu tai moi waypoint
   wait_at_waypoint:
     plugin: "nav2_waypoint_follower::WaitAtWaypoint"  # Plugin cho robot tam dung tai waypoint
     enabled: True  # Bat/tat plugin wait_at_waypoint
     waypoint_pause_duration: 200  # Thoi gian cho (ms) sau khi den waypoint; 0 thi di tiep ngay

velocity_smoother:
 ros__parameters:
   use_sim_time: True
   # smoothing_frequency: 20.0
   smoothing_frequency: 30.0  # Tan so (Hz) lam muot lenh van toc
   scale_velocities: False  # Dieu chinh ty le cac thanh phan van toc khi bi gioi han gia toc
   feedback: "OPEN_LOOP"  # OPEN_LOOP: dung lenh van toc cuoi; CLOSED_LOOP: dung odom
   max_velocity: [0.4, 0.0, 0.3]  # Van toc toi da [x, y, theta] (m/s, m/s, rad/s)
  #  min_velocity: [0.07, 0.0, 0.15]  # Van toc toi thieu [x, y, theta] (m/s, m/s, rad/s)
   min_velocity: [-0.4, 0.0, -0.3]  # Van toc toi thieu [x, y, theta] (m/s, m/s, rad/s)
   max_accel: [6.667, 0.0, 5.0]  # Gia toc toi da [x, y, theta]
   max_decel: [-6.667, 0.0, -5.0]  # Gia toc giam toi da [x, y, theta] (gia tri am)
  #  max_accel: [0.45, 0.0, 0.45 ]  # Gia toc toi da [x, y, theta]
  #  max_decel: [-0.50, 0.0, -0.50]  # Gia toc giam toi da [x, y, theta] (gia tri am)
   # odom_topic: "odom"
   odom_topic: /odometry/filtered # dung vi minh dung bo loc odom --- Topic odom (chi dung khi feedback CLOSEDLoop)
   odom_duration: 0.1  # Thoi gian (s) buffer odom de uoc luong toc do (chi dung khi CLOSEDLoop)
   # deadband_velocity: [0.0, 0.0, 0.0]  # Van toc toi thieu gui xuong driver [x, y, theta] de tranh stall
   deadband_velocity: [0.0165, 0.0, 0.121]  # Van toc toi thieu gui xuong driver [x, y, theta] de tranh stall
   # 0.0165 m/s = 110 vong/phut
   # 0.121rad/s = 110vong/phut
   velocity_timeout: 1.0  # Timeout (s) khong nhan lenh moi thi gui Twist zero va dung publish

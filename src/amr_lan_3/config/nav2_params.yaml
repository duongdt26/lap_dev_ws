
amcl:
 ros__parameters:
   use_sim_time: True  # Dung thoi gian mo phong (/clock) thay vi thoi gian thuc
   # alpha1: 0.2
   # alpha2: 0.2
   # alpha3: 0.2
   # alpha4: 0.2
   alpha1: 0.3  # Nhieu quy trinh du kien trong uoc luong quay tu quay (odom)
   alpha2: 0.3  # Nhieu quy trinh du kien trong uoc luong quay tu dich chuyen (odom)
   alpha3: 0.3  # Nhieu quy trinh du kien trong uoc luong dich chuyen tu dich chuyen (odom)
   alpha4: 0.3  # Nhieu quy trinh du kien trong uoc luong dich chuyen tu quay (odom)
   alpha5: 0.2  # Chi cho mo hinh Omni: nhieu dich chuyen
   base_frame_id: "base_footprint"  # Khung goc robot (base frame)
   # Tu dong dat robot tai goc map moi khi AMCL khoi dong.
   # Co the ghi de bang cac launch argument initial_pose_x/y/z/yaw.
   set_initial_pose: true
   always_reset_initial_pose: true
   initial_pose:
     x: 0.0
     y: 0.0
     z: 0.0
     yaw: 0.0
   beam_skip_distance: 0.5  # Khoang cach toi da (m) de bo qua tia laser khong khop voi hat
   beam_skip_error_threshold: 0.9  # Ty le tia loi sau do bat buoc cap nhat day du de phuc hoi hoi tu
   beam_skip_threshold: 0.3  # Ty le tia toi thieu de kich hoat bo qua tia (beam skip)
   # do_beamskip: false  # true neu moi truong co nguoi vat di dong, nguoc lai false --- Bat/tat bo qua tia laser trong mo hinh likelihood field
   do_beamskip: true  # 26_06_2026 Chuong xui bay
   global_frame_id: "map"  # Ten khung toa do do localization publish (map)
   lambda_short: 0.1  # He so suy giam mu cho thanh phan z_short cua mo hinh laser
   # laser_likelihood_max_dist: 2.0
   laser_likelihood_max_dist: 2.5  # Khoang cach toi da (m) phong dai vat can tren ban do cho mo hinh likelihood field
   # laser_max_range: 100.0
   # laser_max_range: 12.0  # Tam quet toi da (m); -1 dung tam laser bao cao
   laser_max_range: 25.0
   # laser_min_range: -1.0
   laser_min_range: 0.15  # Tam quet toi thieu (m); -1 dung tam laser bao cao
   laser_model_type: "likelihood_field"  # Mo hinh laser: beam, likelihood_field, hoac likelihood_field_prob
   # max_beams: 60
   max_beams: 120  # So tia laser deu nhau dung khi cap nhat bo loc
   # max_particles: 2000
   # min_particles: 500
   max_particles: 5000  # So hat toi da trong bo loc hat
   min_particles: 1000  # So hat toi thieu trong bo loc hat
   odom_frame_id: "odom"  # Khung odom dung cho mo hinh chuyen dong
   pf_err: 0.05  # Sai so dan so hat (particle filter population error)
   pf_z: 0.99  # Mat do dan so hat (percentile 99%)
   # recovery_alpha_fast: 0.0
   # recovery_alpha_slow: 0.0
   recovery_alpha_fast: 0.1  # He so suy giam nhanh trong loc trong so hat; quyet dinh khi them pose ngau nhien de phuc hoi
   recovery_alpha_slow: 0.001  # He so suy giam cham trong loc trong so hat; quyet dinh khi them pose ngau nhien de phuc hoi
   resample_interval: 1  # So lan cap nhat bo loc truoc khi resample
   robot_model_type: "nav2_amcl::DifferentialMotionModel"  # Plugin mo hinh chuyen dong (differential hoac omni)
   save_pose_rate: 0.5  # Tan so (Hz) luu pose/covariance cuoi len parameter server; -1 de tat
   # sigma_hit: 0.2  # Do lech chuan Gaussian cho thanh phan z_hit cua mo hinh laser
   sigma_hit: 0.18 # 26_06_2026 Chuong xui bay
   tf_broadcast: true  # false de AMCL khong publish transform map->odom
   # transform_tolerance: 1.0
   # transform_tolerance: 0.3
   transform_tolerance: 0.5  # Thoi gian (s) post-date transform de danh dau con hieu luc trong tuong lai
   # update_min_a: 0.2
   # update_min_d: 0.25
   update_min_a: 0.15  # Goc quay toi thieu (rad) truoc khi cap nhat bo loc
   update_min_d: 0.15  # Dich chuyen toi thieu (m) truoc khi cap nhat bo loc
   # z_hit: 0.5  # Trong so hon hop z_hit (tong cac z dung phai = 1)
   z_hit: 0.75 # 26_06_2026 Chuong xui bay
   z_max: 0.05  # Trong so hon hop z_max (chi dung voi mo hinh beam)
   # z_rand: 0.5  # Trong so hon hop z_rand
   z_rand: 0.2 # 26_06_2026 Chuong xui bay
   z_short: 0.05  # Trong so hon hop z_short (chi dung voi mo hinh beam)
   # scan_topic: scan
   scan_topic: /scan_filtered  # Topic LaserScan de AMCL subscribe



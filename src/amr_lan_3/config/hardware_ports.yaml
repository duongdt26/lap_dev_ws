# ===== NGUỒN DUY NHẤT quản lý cổng serial của các thiết bị =====
# Đổi port ở đây, KHÔNG sửa rải rác trong code/launch nữa.

rplidar_node:
  ros__parameters:
    # serial_port: /dev/serial/by-path/pci-0000:05:00.4-usb-0:2:1.0-port0
    serial_port: /dev/serial/by-path/pci-0000:00:14.0-usb-0:1.3:1.0-port0 # may Chuong
    # serial_port: /dev/serial/by-path/pci-0000:00:14.0-usb-0:1.3:1.0-port0 # may Chuong

imu_uart_node:
  ros__parameters:
    # port: /dev/serial/by-path/pci-0000:00:14.0-usb-0:1.1:1.0-port0
    port: /dev/serial/by-path/pci-0000:00:14.0-usb-0:1.1:1.0-port0 # may Chuong

stm32_conveyor_bridge_node:
  ros__parameters:
    # port: /dev/serial/by-path/pci-0000:05:00.3-usb-0:2.3:1.0-port0
    #  port: /dev/serial/by-path/pci-0000:00:14.0-usb-0:1.3:1.0-port0
    port: /dev/serial/by-path/pci-0000:00:14.0-usb-0:1.2:1.0-port0 #nay Chuong
    # port: /dev/serial/by-path/pci-0000:00:14.0-usb-0:2:1.0-port0 #nay Chuong

magnetic_line_follower_node:
  ros__parameters:
    # BAT BUOC: thay bang /dev/serial/by-id/... hoac /dev/serial/by-path/...
    # cua bus cam bien tu ID83 + ID86 tren may robot.
    port: /dev/serial/by-path/pci-0000:00:14.0-usb-0:3:1.0-port0

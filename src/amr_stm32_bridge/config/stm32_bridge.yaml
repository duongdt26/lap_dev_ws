# Tham số stm32_conveyor_bridge_node (V4.1)
stm32_conveyor_bridge_node:
  ros__parameters:
    baudrate: 256000
    simulate: false
    ping_interval_sec: 0.5      # khuyến nghị 500ms
    pong_timeout_sec: 2.0       # COMM_LOST nếu mất PONG >2s
    belt_action_timeout_sec: 60.0
    auto_ready: true            # tự gửi READY sau HELLO
